# Builds every image on pull requests and on main; publishes ONE image to
# GHCR when a tag of the form <image>-v<semver> is pushed (kiosk-v0.1.0).
#
# GitHub-hosted arm64 runners on purpose, never the org's self-hosted ones:
# this repository is public, and the self-hosted runners must never execute a
# stranger's pull request (orchestrator/docs/CI-RUNNERS.md). Only arm64 is
# built — the images run on Raspberry Pi nodes and nowhere else.
name: Images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['*-v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [kiosk]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag publishes exactly the image it names; every other event builds
      # everything and publishes nothing.
      - name: Decide whether this run publishes ${{ matrix.image }}
        id: decide
        env:
          REF: ${{ github.ref }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [[ "$REF" == "refs/tags/${IMAGE}-v"* ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.decide.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/orchestrator-${{ matrix.image }}
          tags: |
            type=match,pattern=${{ matrix.image }}-v(.*),group=1
            type=raw,value=latest,enable=${{ steps.decide.outputs.push == 'true' }}
            type=sha,enable=${{ steps.decide.outputs.push != 'true' }}

      - name: Build${{ steps.decide.outputs.push == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.image }}
          platforms: linux/arm64
          push: ${{ steps.decide.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
